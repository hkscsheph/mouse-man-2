<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mouse Crowd</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <video id="cam" playsinline autoplay muted></video>
    <p id="gate">Allow the camera to begin</p>
    <button id="tune-toggle" type="button" aria-expanded="false" aria-controls="tune" title="Adjust chest and ear position (H)">Tune mice</button>
    <div id="tune" class="hidden" hidden>
      <label for="feature-scale">Eyes &amp; mouth</label>
      <input id="feature-scale" type="range" min="0.7" max="2.2" step="0.05" value="1.5" />
      <span id="feature-scale-val">1.00×</span>
      <label for="eye-position">Eye position</label>
      <input id="eye-position" type="range" min="-0.15" max="0.15" step="0.01" value="0.05" />
      <span id="eye-position-value" class="tune-value">0.00</span>
      <label for="nostril-scale">Nostril size</label>
      <input id="nostril-scale" type="range" min="2" max="3.6" step="0.05" value="2.4" />
      <span id="nostril-scale-val" class="tune-value">1.00×</span>
      <label for="chest-position-x">Chest X</label>
      <input id="chest-position-x" type="range" min="-0.50" max="0.50" step="0.01" value="0" title="Position as a fraction of body width" />
      <span id="chest-position-x-value" class="tune-value">0.00×</span>
      <label for="chest-position-y">Chest Y</label>
      <input id="chest-position-y" type="range" min="-0.50" max="0.50" step="0.01" value="0" title="Position as a fraction of body height" />
      <span id="chest-position-y-value" class="tune-value">-0.15×</span>
      <label for="chest-position-z">Chest Z</label>
      <input id="chest-position-z" type="range" min="-0.50" max="0.50" step="0.01" value="-0.10" title="Position as a fraction of body depth" />
      <span id="chest-position-z-value" class="tune-value">-0.10×</span>
      <label for="chest-tilt">Chest rotation</label>
      <input id="chest-tilt" type="range" min="-45" max="45" step="1" value="30" />
      <span id="chest-tilt-value" class="tune-value">30°</span>
      <label for="ear-position">Ear position</label>
      <input id="ear-position" type="range" min="-0.30" max="0.30" step="0.01" value="0.10" />
      <span id="ear-position-value" class="tune-value">0.10</span>
      <label for="ear-tilt">Ear rotation</label>
      <input id="ear-tilt" type="range" min="-45" max="45" step="1" value="-25" />
      <span id="ear-tilt-value" class="tune-value">-25°</span>
    </div>
    <aside id="share" class="empty" aria-label="Share this mouse">
      <div id="share-frame">
        <canvas id="share-qr" width="132" height="132" aria-hidden="true"></canvas>
        <div id="share-loading" aria-hidden="true">
          <span class="share-spinner"></span>
        </div>
      </div>
      <p id="share-hint">Hold still to save your mouse</p>
    </aside>
    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
