[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Functions v2 mounts via export const config.path = "/api/mouse".
# Do not also redirect /api/mouse → /.netlify/functions/mouse (that 404s Blobs routes).
